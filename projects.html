    <title>Kyle Schwartz</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="images/favicon.ico.bmp">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">

<body>
    
    <div id="container">
        
        <!--Uses a JavaScript function to display navbar on server hosted pages-->
        <div w3-include-html="nav.html"></div>

        <!-- Main content -->
        <main>
        <div class="title-div">
            <h1 class="title-div">Projects</h1>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <input 
                type="text" 
                id="project-search" 
                placeholder="Search projects by title, date, skills..." 
                oninput="handleSearch()"
            />
        </div>

        <!-- Section 1: Featured Projects (Also rendered on index.html) -->
        <section class="project-section" id="featured-section">
            <h2 class="project-section-title">Featured Projects</h2>
            <p class="section-subtitle">Recent major capstone-level projects</p>
            <div id="featured-projects-container" class="tiles"></div>
        </section>

        <!-- Section 2: Major Projects (Not on index.html) -->
        <section class="project-section" id="major-section">
            <h2 class="project-section-title">Major Projects</h2>
            <p class="section-subtitle">Important personal and course projects</p>
            <div id="major-projects-container" class="tiles"></div>
        </section>

        <!-- Section 3: Other Projects -->
        <section class="project-section" id="other-section">
            <h2 class="project-section-title">Additional Projects / Experiments</h2>
            <p class="section-subtitle">Small games, scripts, and past projects</p>
            <div id="other-projects-container" class="tiles"></div>
        </section>

        <!-- Empty Search State Message -->
        <div id="no-results" class="no-results" style="display: none;">
            <p>No projects match your search query.</p>
        </div>

        <figure class="frame">
            <a href="https://github.com/KySchwartz"><img src="images/githublogo.png" alt="GitHub Logo" style="border: 2px solid black"></a>
            <figcaption class="pic-text">GitHub Repositories</figcaption>
        </figure>
    </main>

        <!--Uses a JavaScript function to display footer on server hosted pages-->
        <div w3-include-html="footer.html"></div>
        
    </div>
    
    <script src="scripts/script.js"></script>
    <script>
        // Displays the navbar and loads project tiles
        includeHTML();
        loadAndRenderProjectsPage();
    </script>

<!-- Image Zoom Modal Overlay -->
<div id="image-modal" class="modal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modal-img" alt="Enlarged View">
    <div id="modal-caption"></div>
</div>

</body>
</html>
